name: build-and-deploy

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'output/**'
      - 'state/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Ci_Passw0rd!2026'
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Create test database
        working-directory: app/server
        env:
          CI_SQL_MASTER: 'Server=localhost,1433;Database=master;User Id=sa;Password=Ci_Passw0rd!2026;Encrypt=false;TrustServerCertificate=true'
        run: node scripts/ci-create-test-db.mjs

      - name: Test
        working-directory: app
        env:
          AZURE_SQL_CONNECTION_STRING: 'Server=localhost,1433;Database=spostorage-test;User Id=sa;Password=Ci_Passw0rd!2026;Encrypt=false;TrustServerCertificate=true'
        run: npm run test:ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Stage deployment package
        run: |
          node scripts/ci/stage-package.mjs "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP/pkg"
          npm install --omit=dev --no-audit --no-fund
          rm -rf node_modules/@spostorage/shared
          mkdir -p node_modules/@spostorage/shared
          cp -r shared/. node_modules/@spostorage/shared/
          zip -qr "$RUNNER_TEMP/spostorage.zip" .
          ls -la "$RUNNER_TEMP/spostorage.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: spostorage-package
          path: ${{ runner.temp }}/spostorage.zip
          retention-days: 7

  deploy:
    needs: build
    # Only on pushes to the main branch of a repository configured for deployment (forks just build and test).
    if: github.event_name != 'pull_request' && vars.WEB_APP_NAME != '' && vars.ENGINE_APP_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Set WEB_APP_NAME and ENGINE_APP_NAME as repository variables (Settings → Variables).
        app:
          - ${{ vars.WEB_APP_NAME }}
          - ${{ vars.ENGINE_APP_NAME }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spostorage-package

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ${{ matrix.app }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.app }}
          package: spostorage.zip
          type: zip
          clean: true
          restart: true

      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            body=$(curl -s -m 15 "https://${{ matrix.app }}.azurewebsites.net/api/health" || true)
            if echo "$body" | grep -q "${GITHUB_SHA}"; then
              echo "healthy on ${GITHUB_SHA}"; exit 0
            fi
            sleep 15
          done
          echo "health did not report commit ${GITHUB_SHA}"; echo "$body"; exit 1
